<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하우스키핑 인수인계</title>
<meta name="theme-color" content="#10233F">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>

:root{--bg:#F4F6F9;--surface:#fff;--ink:#111827;--muted:#5B6472;--line:#E3E7EE;--soft:#F2F5FA;--navy:#10233F;--navy2:#1D3A6E;--gold:#C8A96A;
--grn:#1E8E3E;--grn-s:#E8F5EC;--org:#E8710A;--org-s:#FFF3E6;--red:#B23A48;--red-s:#FDEDEF;--blu:#2F6FD0;--blu-s:#EAF1FC;
--f:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f)}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.top b{font-size:17px;letter-spacing:-.2px}.top .sp{flex:1}
.top a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.top a.hk{border-color:#f08a24;background:rgba(240,138,36,.14)}
.wrap{max-width:1240px;margin:0 auto;padding:14px 18px 40px}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding-top:4px}
.daychips button{font:inherit;min-width:70px;line-height:1.2;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#f1f2f4;color:#9aa0a8;font-weight:700}
.daychips button small{display:block;font-size:11px;font-weight:500;opacity:.85}
.daychips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.daychips button.past{background:#fff;color:var(--ink)}
.glance{display:grid;grid-template-columns:1.1fr 1fr 2.6fr;gap:10px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.big{font-size:20px;font-weight:800;margin-top:2px}.big small{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.lights{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--soft);font-weight:700;font-size:13px}
.lt b{font-size:15px}.lt.z{opacity:.45}.lt.sum{background:var(--navy);color:#fff;border-color:var(--navy)}
.lt i{font-style:normal;font-weight:500;color:var(--muted);font-size:12px}
.notice{margin-bottom:12px;border-left:4px solid var(--gold)}
.notice h3,.col h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.notice .nl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ni{background:#FBF8F1;border:1px solid #EFE4CC;border-radius:10px;padding:8px 10px}
.ni .t{font-weight:800}.ni .p{font-size:12px;color:#8A6A1F;font-weight:700;margin-left:6px}
.ni .d{font-size:13px;color:#3d4350;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col h3 .who{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.pill{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px}
.p-day{background:#FFF6DA;color:#8A6100}.p-night{background:#E7ECF7;color:var(--navy2)}
.carry{background:var(--org-s);border:1px solid #F6CFA6;border-radius:12px;padding:8px 10px;margin-bottom:8px}
.carry .k{color:#B45309}
.it{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:9px 2px;border-top:1px solid var(--line)}
.carry .it{border-top-color:#F6CFA6}.carry .it:first-of-type,.list .it:first-child{border-top:0}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid #C5CCD8;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff}
.it.done .ck{background:var(--grn);border-color:var(--grn)}
.it.done .tx{color:#8B93A1;text-decoration:line-through;text-decoration-color:#C5CCD8}
.tx{font-size:14px}.tg{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
.g-heat{background:#FDECEC;color:#B42318}.g-grp{background:#EAF1FC;color:#1D4E9E}.g-fac{background:#F3EEFF;color:#5B3CC4}.g-in{background:#E9F7EF;color:#17663A}
.g-pri{background:#FFF0E0;color:#B45309}.g-cmd{background:#10233F;color:#fff}.g-etc{background:#EEF0F3;color:#4B5563}
.rm{display:inline-block;font-weight:800;color:var(--navy2);background:#EEF3FB;border-radius:5px;padding:0 4px;margin:0 1px}
.mt{font-size:11.5px;color:#9AA1AC;margin-top:2px}
.st{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:#fff}
.st.cont{border-color:#F6CFA6;color:#B45309;background:#FFF7EE}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;font:inherit;border:1.5px dashed #C9D1DD;border-radius:10px;padding:9px 12px;background:#FBFCFE}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.quick span{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 9px;color:var(--muted);font-weight:700}
.foot{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.foot b{color:var(--ink)}.foot .sp{flex:1}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:760px){
 .glance{grid-template-columns:1fr 1fr}.glance .lights-card{grid-column:1/-1}
 .cols{grid-template-columns:1fr}.notice .nl{grid-template-columns:1fr}
 .top b{font-size:15px}.daychips{flex-wrap:nowrap;overflow-x:auto}.daychips button{min-width:58px;flex:0 0 auto;padding:6px 6px}
 .top a.pr{display:none}
}

button,input,textarea,select{font:inherit;color:inherit}
.top a.back{border:0;font-size:24px;padding:0 6px;line-height:1}
.daychips .nav{min-width:36px;background:#fff;color:var(--ink)}
/* 11/26 소장님: 오늘 날짜 칸은 주황으로 숨쉬듯 강조 (룸메이드 스케줄 '내일' 칸과 같은 모양) */
.daychips button.today{position:relative;border:1.5px solid #f08a24;color:#c25e00;background:#fff7ef;animation:tdglow 2.2s ease-in-out infinite}
.daychips button.today.on{background:var(--navy);color:#fff;border-color:#f08a24}
.daychips button.today::before{content:'오늘';position:absolute;top:-8px;right:-6px;background:#f08a24;color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:9px;line-height:1.5}
@keyframes tdglow{0%,100%{box-shadow:0 0 0 1px rgba(255,197,138,.5),0 0 6px 1px rgba(255,140,40,.35)}50%{box-shadow:0 0 0 2px rgba(255,214,170,.9),0 0 16px 4px rgba(255,140,40,.6)}}
.daychips{padding-top:9px}
.fi{width:100%;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-6px;background:transparent;font-size:20px;font-weight:800}
.fi:hover,.fi:focus{border-color:var(--line);background:#fff;outline:none}
.fi::placeholder{color:#B5BCC8;font-weight:600}
.lt{cursor:pointer}.ro .lt{cursor:default}
.lted{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:8px}
.lted label{display:grid;grid-template-columns:64px 54px 1fr;gap:4px;align-items:center;font-size:13px;font-weight:700}
.lted input{border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ni{position:relative}.ni .ed{position:absolute;top:6px;right:8px;font-size:12px;color:#8A6A1F;background:none;border:0;cursor:pointer;font-weight:700}
.nform{display:grid;gap:6px;margin-top:8px;background:#FBF8F1;border:1px dashed #E2CF9F;border-radius:10px;padding:10px}
.nform input,.nform textarea,.ited textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.nform textarea,.ited textarea{min-height:70px;resize:vertical}
.empty{color:#9AA1AC;font-size:13px;padding:10px 2px}
.ck{cursor:pointer;background:#fff}.ro .ck{cursor:default}
.tx{cursor:text;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}.ro .tx{cursor:default}
.it .del{border:0;background:none;color:#B23A48;font-weight:700;cursor:pointer;font-size:12px}
.ited{display:grid;gap:6px}
.add input:focus{outline:none;border-color:var(--navy2);border-style:solid;background:#fff}
.quick span{cursor:pointer}.quick span:hover{border-color:var(--navy2);color:var(--navy2)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.red{color:#B23A48;border-color:#F1C6CC}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.login{max-width:420px;margin:40px auto}.login .seg{display:flex;gap:6px;margin:8px 0}.login .seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}
.login .seg button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}
.err{color:#B23A48;font-weight:700}
.sync{font-size:12px;opacity:.75;font-weight:600}
.imp{margin-top:14px;font-size:12.5px;color:var(--muted)}
/* 11/26 휴대폰(글자 크게 설정한 폰 포함): 위 띠가 두 줄로 밀려 잘리던 것 → 한 줄로 */
@media (max-width:760px){
 .top{padding:8px 10px;gap:8px;flex-wrap:nowrap}
 .top b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
 .top .sp,.top .sync{display:none}
 .top a.hk{white-space:nowrap;flex:0 0 auto;padding:5px 10px;font-size:12.5px}
 .top .lg{display:none}
 .lights-card .k span{display:none}
 .fi::placeholder{font-size:15px}
 .wrap{padding:10px 10px 30px}
 .glance .card{padding:10px 12px;min-width:0}
 .fi{font-size:17px}
 .notice h3{flex-wrap:wrap}.notice h3>span{flex-basis:100%;order:3}
 .card h3{font-size:14.5px}
}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff;font-size:12px}.top,.daychips,.add,.quick,.foot .sp~span,.imp,.noprint,.nform,.ni .ed{display:none!important}
 .ph{display:block!important;font-size:18px;font-weight:900;margin:0 0 8px;border-bottom:3px solid var(--gold);padding-bottom:4px}
 .wrap{max-width:none;padding:0}.card{break-inside:avoid;border-color:#ccc}
 .cols{grid-template-columns:1fr 1fr}.glance{grid-template-columns:1fr 1fr 2.6fr}
 .daychips button.today{animation:none}
}
.ph{display:none}
</style>
</head>
<body>
<div class="top"><a class="back" href="../" aria-label="허브로">‹</a><b>🛎️ <span class="lg">하우스키핑 </span>인수인계</b><span class="sync" id="sync"></span><span class="sp"></span><a class="hk" href="../rmsched/#hk">📣 HK 배정<span class="lg"> · 인계사항</span></a><a class="pr" href="#" id="printBtn">🖨 인쇄</a></div>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script type="module" src="hkho.js?v=2026.11.26-2"></script>
</body>
</html>
