<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>객실 인스펙션</title>
<meta name="theme-color" content="#10233F">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인스펙션">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#111827; --muted:#4B5563; --line:#E5E8EE; --tile:#F2F5FA;
  --navy:#10233F; --brand:#1D3A6E; --gold:#C79A3B; --ok:#1E8E3E; --ok-soft:#E8F5EC; --warn:#B23A48; --warn-soft:#FDEDEF;
  --wait:#8A5A00; --wait-soft:#FDF3DC; --shadow:0 2px 10px rgba(17,24,39,.06);
  --warn-red:#B42318; --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45}
button{font-family:inherit}
.top{position:relative;background:#0E1E36;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 15px}
@media (display-mode:standalone){.top{padding-top:calc(16px + max(env(safe-area-inset-top), 28px))}}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),#E8C77A 50%,var(--gold))}
.top-in{max-width:760px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:12px}
.top .cal{width:54px;height:58px;border-radius:13px;background:linear-gradient(180deg,#fff,#EEF2F8);color:var(--navy);text-align:center;flex:none;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.top .cal i{display:block;font-style:normal;background:var(--gold);color:#fff;font-weight:800;font-size:10.5px;line-height:17px;white-space:nowrap}
.top .cal b{display:block;font-family:var(--f-num);font-weight:600;font-size:25px;line-height:40px;font-variant-numeric:tabular-nums}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.4px;line-height:1.25;word-break:keep-all}
.top .sub{font-size:12.5px;opacity:.72;margin-top:3px}
.top .ring{flex:none;width:56px;height:56px;position:relative}
.top .ring svg{display:block}
.top .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:600;font-size:14px;color:#E8C77A;font-variant-numeric:tabular-nums}
.top .line{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:12.5px;opacity:.9}
.top .line:empty{display:none}
.top .line b{font-family:var(--f-num);color:#fff;font-size:14px;margin-left:4px}
.top .line .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-right:6px;box-shadow:0 0 0 3px rgba(61,220,132,.18);vertical-align:1px}
.top .line .dot.bad{background:#F26B7A;box-shadow:0 0 0 3px rgba(242,107,122,.2)}.top .line .dot.wait{background:#F2B544;box-shadow:0 0 0 3px rgba(242,181,68,.2)}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--surface);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-size:12.5px;font-weight:500;color:var(--muted)}
.ref{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:700 13px inherit;cursor:pointer;white-space:nowrap}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pill{border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--warn-soft);color:var(--warn)}.pill.wait{background:var(--wait-soft);color:var(--wait)}
.st{list-style:none;margin:0;padding:0}
.st li{display:grid;grid-template-columns:26px 1fr;gap:6px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.st li:first-child{border-top:0}
.st li b{display:block;font-size:15px}
.st li span{color:var(--muted);font-size:13px}
.st li.bad b{color:var(--warn)}.st li.wait b{color:var(--wait)}
.prog{margin:2px 0 4px}
.prog .big{font-size:30px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.prog .big small{font-size:15px;font-weight:700;color:var(--muted);margin-left:6px}
.bar{height:14px;border-radius:99px;background:var(--tile);overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#3B6FB6);border-radius:99px;transition:width .4s}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--tile);border-radius:12px;padding:9px 10px}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kv span{font-size:12.5px;color:var(--muted)}
.go-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);background:var(--tile);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 12px;min-height:96px}
.go .ic{font-size:22px}
.go b{font-size:15.5px}
.go span{font-size:12.5px;color:var(--muted);line-height:1.35}
.go:active{transform:scale(.98)}
.big-btn{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:800 16px inherit;cursor:pointer}
.big-btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.login .seg{display:flex;gap:8px;margin:0 0 10px}
.login .seg button{flex:1;min-height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font:700 16px inherit;cursor:pointer;color:var(--ink)}
.login .seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.login input{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:17px inherit;margin:0 0 10px}
.err{color:var(--warn);font-weight:700;font-size:14px;margin:0 0 10px}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.foot button{border:0;background:none;color:var(--brand);text-decoration:underline;font:700 13px inherit;cursor:pointer}
.seg2{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{flex:1;min-height:46px;border:0;background:transparent;color:var(--ink);font:700 15px inherit;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:#fff}
.upsum{margin:12px 0 4px;font-size:15px;line-height:1.55}.upsum p{margin:4px 0}
.upchk{list-style:none;margin:6px 0;padding:0;font-size:14px}.upchk li{padding:2px 0}.upchk li.no{color:var(--warn);font-weight:700}
.upsum details{margin-top:6px;font-size:14px}.upsum summary{cursor:pointer;color:var(--muted)}
.warnbox{background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14.5px;line-height:1.5}.warnbox b{color:var(--warn)}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px;font-weight:700;margin:0 0 10px}
.waitbox{background:var(--wait-soft);color:var(--wait);border-radius:12px;padding:12px;font-weight:700;margin:0}
#upcard{scroll-margin-top:84px}
.btn2{display:flex;gap:8px;margin-top:12px}.btn2 .big-btn{flex:1}
.big-btn.danger{background:var(--warn)}.big-btn[disabled]{opacity:.5}
.linkbtn{display:flex;align-items:center;justify-content:center;text-decoration:none}

.vp-x{width:44px;height:44px;border:0;border-radius:12px;background:var(--tile);color:var(--ink);font-size:18px;cursor:pointer}.vp-x[disabled]{opacity:.3}
.top .out{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:99px;padding:5px 11px;font:700 12.5px var(--f-body);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{min-height:42px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--tile);color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}.chip.add{background:var(--surface);color:var(--brand);border-style:dashed}
.chips.sm{margin-top:6px}.chips.sm .chip{min-height:34px;padding:0 10px;font-size:13.5px;border-radius:99px}.chip.ghost{background:var(--surface);color:var(--muted)}
.by-g{margin:0 0 10px}.by-g>b{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.bybar{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:15px}.bybar small{color:var(--muted)}.bybar .ref{margin-left:auto}
.shoot{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:0 0 14px}.big-btn.cam{background:var(--navy);font-size:17px}
.big-btn.ok{background:var(--ok)}.btn3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;margin-top:12px}.btn3 .big-btn{min-height:50px;font-size:15px}
.day{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}.day b{font-size:16px}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 4px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.card h2+.row{border-top:0}.row.wait{background:var(--warn-soft);border-radius:10px}
.row .rm{font:800 19px var(--f-num);min-width:52px}.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}.row .rt b{font-size:15px}.row .rt small{color:var(--muted);font-size:12.5px}
.row .st{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap}.row .st.w{color:var(--warn)}
.card.itop{padding-bottom:10px}.f{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;margin:0 0 8px}.f label{font-weight:800;font-size:14px;color:var(--muted)}
.f input{width:100%;box-sizing:border-box;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:17px var(--f-body);background:var(--surface);color:var(--ink)}
.f .roomin{font:800 24px var(--f-num);letter-spacing:2px}.note.warn{color:var(--wait);font-weight:700;margin:6px 0 0}
.ph{background:var(--surface);border-radius:18px;padding:10px;margin:0 0 12px;box-shadow:var(--shadow)}.ph.plate{opacity:.75}
.pimg{position:relative;border-radius:12px;overflow:hidden;background:#E4E8EF}.pimg img{display:block;width:100%;max-height:62vh;object-fit:contain}
.pno{position:absolute;left:10px;top:10px;min-width:34px;height:34px;border-radius:99px;background:var(--warn);color:#fff;font:900 17px var(--f-body);display:flex;align-items:center;justify-content:center;padding:0 6px}
.ph.plate .pno{background:var(--navy)}
.px{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}
.ptxt{width:100%;box-sizing:border-box;min-height:50px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:700 17px var(--f-body);background:var(--surface);color:var(--ink)}
.ex{display:flex;gap:6px;margin:0 0 6px}.ex input{flex:1;min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:16px var(--f-body)}
.ibar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:760px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(17,24,39,.15);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
body.drafting main{padding-bottom:calc(230px + env(safe-area-inset-bottom))}
.bar1{display:grid;grid-template-columns:1.4fr .6fr 1fr;gap:8px;align-items:center;margin:0 0 8px}.bar1 .big-btn{min-height:48px}.cnt{text-align:center;font-weight:700;color:var(--muted)}.cnt b{font-size:22px;color:var(--warn)}
.ibar .btn2{margin-top:0}.bar2{display:flex;justify-content:space-between;margin-top:8px}
.cardimg{display:block;width:100%;border-radius:12px;border:1px solid var(--line);margin:0 0 8px}
.txt{white-space:pre-wrap;font:15px/1.6 var(--f-body);background:var(--tile);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumbs figure{margin:0}.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#E4E8EF}.thumbs figcaption{font-size:13px;font-weight:700;margin-top:4px}
.ai{font-size:13px;font-weight:700;color:var(--brand);margin:6px 0 0}.ai.busy{color:var(--muted)}.ai.warn{color:var(--wait)}
.aiset{margin-top:16px;font-size:14px}.aiset summary{cursor:pointer;color:var(--muted);margin-bottom:8px}.aiset .f{grid-template-columns:96px 1fr}.aiset select{min-height:44px;border:1.5px solid var(--line);border-radius:12px;font:15px var(--f-body)}
.lrn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.lrn s{color:var(--muted)}.lrn small{color:var(--muted)}.lrn.off span{opacity:.4}
.camv{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
.camv video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff}
.cam-n{font:900 20px var(--f-body);background:var(--warn);border-radius:99px;padding:2px 12px}.cam-msg{font-size:13px;opacity:.9}
.cam-strip{position:absolute;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;padding:0 12px}.cam-strip img{width:56px;height:74px;object-fit:cover;border-radius:8px;border:2px solid #fff;flex:none}
.cam-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 20px calc(18px + env(safe-area-inset-bottom));background:#000}
.cam-x{justify-self:start;border:0;border-radius:99px;background:var(--ok);color:#fff;font:900 17px var(--f-body);padding:12px 22px;cursor:pointer}
.cam-shot{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000;cursor:pointer}.cam-shot:active{transform:scale(.92)}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.cam-flash.on{animation:camf .18s}
@keyframes camf{from{opacity:.7}to{opacity:0}}
body.camming{overflow:hidden}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="top-row"><div class="tt"><h1>🔍 객실 인스펙션</h1><div class="sub" id="who">한화리조트 해운대</div></div><button class="out" id="out">로그아웃</button></div></div></header>
<main id="main"><div class="card"><p class="note" style="margin:0">여는 중…</p></div></main>
<script type="module" src="insp.js?v=2026.11.20-2"></script>
</body>
</html>
