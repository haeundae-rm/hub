.ds-stamp .c.done::after{content:'완료';position:absolute;right:3px;bottom:3px;transform:rotate(-14deg);border:2px solid #1E9E5A;color:#1E9E5A;border-radius:50%;width:clamp(24px,36cqw,32px);height:clamp(24px,36cqw,32px);display:flex;align-items:center;justify-content:center;font:900 clamp(8px,11cqw,10px) 'Noto Sans KR',sans-serif;background:#ffffffd9;pointer-events:none}

/* E 흑백 + 배지: 끝난 방은 색이 빠지고(남은 방만 컬러) 오른쪽 위 초록 원 ✓ */
.ds-gray .c.done{background:#EDEDEA!important;border-color:#e2e2de}.ds-gray .c.done .no,.ds-gray .c.done .nm,.ds-gray .c.done .smp{color:#9a9fa6}.ds-gray .c.done .mm span:not(.loud),.ds-gray .c.done .gb{filter:grayscale(1);opacity:.6}

/* F 원형 배지만: 색은 그대로, 오른쪽 위 초록 원 ✓ */
.ds-badge .c.done .no{color:#5b6474}
/* G 사선 무늬: 상태색 위에 옅은 사선 → 종이에 줄 그은 느낌 */

/* 조용한 완료 (11/26 확정안): 끝난 방은 색을 빼고 물러나게, 작은 회색 ✓ · 방금 끝난 방만 잠깐 초록 → 서서히 회색 */
.ds-quiet .c.done{background:#F2F1EE;border-color:#E7E5E0}
.ds-quiet .c.done .no,.ds-quiet .c.done .nm,.ds-quiet .c.done .smp{color:#A3A8AF}
.ds-quiet .c.done .mm span:not(.loud),.ds-quiet .c.done .gb{filter:grayscale(1);opacity:.5}
.ds-quiet .c.done::before{content:'✓';position:absolute;right:4px;top:2px;font:800 11px Inter,sans-serif;color:#A3A8AF}

.ds-quiet .c.done.jd::before{color:#1E9E5A}
@keyframes jd{0%{background:#C9F0D6;border-color:#7CCB98;box-shadow:0 0 0 2px #7CCB9866}8%{background:#D9F4E2;border-color:#9AD8AF;box-shadow:none}100%{background:#F2F1EE;border-color:#E7E5E0}}
@media (prefers-reduced-motion:reduce){.ds-quiet .c.done.jd{animation:none}}

.ds-b3 .c.done{background:#E9EEF3;border-color:#DBE2EA}.ds-b3 .c.done .no,.ds-b3 .c.done .nm,.ds-b3 .c.done .smp{color:#8193A6}.ds-b3 .c.done::before{color:#5B7896}

.ds-s5 .c.done{background:transparent;border-color:#E3E0D9}.ds-s5 .c.done.s1{background:#EEF8EE}.ds-s5 .c.done.s2{background:#FDF0E1}.ds-s5 .c.done.s3{background:#F1F1F1}.ds-s5 .c.done.s4{background:#EEF4FA}

/* ⑥ 흰 바탕: 끝난 방은 하얗게 비우고 가는 테두리만 — 색은 할 일에만 */
.ds-s6 .c.done{background:#fff;border-color:#E5E7EB}.ds-s6 .c.done .no,.ds-s6 .c.done .nm,.ds-s6 .c.done .smp{color:#B0B5BC}.ds-s6 .c.done::before{color:#B0B5BC}.ds-s6 .c.done .mm span:not(.loud),.ds-s6 .c.done .gb{opacity:.35}
/* ⑦ 작은 점: 바탕은 옅게, 호실 번호 앞 초록 점 하나 */
.ds-s7 .c.done{background:#F7F6F3;border-color:#ECEAE5}.ds-s7 .c.done .no,.ds-s7 .c.done .nm{color:#9CA3AF}.ds-s7 .c.done::before{content:'';right:auto;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#1E9E5A}.ds-s7 .c.done .no{padding-left:9px}
/* 모서리 접힘 시안: 오른쪽 위가 종이처럼 접힘 (잘린 자리 = 화면 바탕색, 접힌 면 = 뒷면 색 + 그림자) */
.ds-f1 .c.done::before,.ds-f2 .c.done::before,.ds-f3 .c.done::before,.ds-f4 .c.done::before,.ds-f5 .c.done::before{content:'';position:absolute;top:-1px;right:-1px;width:18px;height:18px;border-bottom-left-radius:4px;box-shadow:-2px 2px 3px #0000002a;background:linear-gradient(225deg,#fff 0 50%,var(--fold) 50%);z-index:1}
.ds-f1 .c.done,.ds-f2 .c.done,.ds-f3 .c.done,.ds-f4 .c.done,.ds-f5 .c.done{border-top-right-radius:0}

.ds-f1 .c.done{--fold:#DAD7D0}.ds-f1 .c.done .nm{color:#5b6474}
/* B 초록 접힘: 접힌 면이 초록 */
.ds-f2 .c.done{--fold:#3DAA6B}
/* C 네이비 접힘: 접힌 면이 앱 네이비, 글자 조금 흐리게 */
.ds-f3 .c.done{--fold:#1F3A60}.ds-f3 .c.done .nm,.ds-f3 .c.done .no{color:#6b7584}
/* D 큰 접힘 + ✓: 접힌 면 안에 작은 ✓ */
.ds-f4 .c.done{--fold:#2E8B57}.ds-f4 .c.done::before{width:24px;height:24px}
.ds-f4 .c.done::after{content:'✓';position:absolute;top:11px;right:3px;font:900 9px/1 Inter,sans-serif;color:#fff;z-index:2}
/* E 접힘 + 빛바램: 바탕 옅게 + 연회색 접힘 */
.ds-f5 .c.done{--fold:#C9CDD3;background:#F5F4F1}.ds-f5 .c.done.s1{background:#EEF8EE}.ds-f5 .c.done.s2{background:#FDF0E1}.ds-f5 .c.done.s4{background:#EEF4FA}.ds-f5 .c.done .nm,.ds-f5 .c.done .no{color:#8A93A0}.ds-f5 .c.done .mm span:not(.loud){opacity:.55}
/* 접힘 시안에서는 '방금 끝남' 초록 빛은 유지하되 ✓ 글자는 숨김 */
.ds-f1 .c.done.jd::before,.ds-f2 .c.done.jd::before,.ds-f3 .c.done.jd::before,.ds-f4 .c.done.jd::before,.ds-f5 .c.done.jd::before{color:transparent}

.d-fade .c.done .no,.d-fade .c.done .nm,.d-fade .c.done .smp{color:#8A93A0}.d-fade .c.done .mm span:not(.loud),.d-fade .c.done .gb{opacity:.5}
.d-fadeg .c.done{background:#F2F1EE;border-color:#E7E5E0}.d-fadeg .c.done .no,.d-fadeg .c.done .nm,.d-fadeg .c.done .smp{color:#A3A8AF}.d-fadeg .c.done .mm span:not(.loud),.d-fadeg .c.done .gb{filter:grayscale(1);opacity:.5}
.d-white .c.done{background:#fff;border-color:#E5E7EB}.d-white .c.done .no,.d-white .c.done .nm,.d-white .c.done .smp{color:#B0B5BC}.d-white .c.done .mm span:not(.loud),.d-white .c.done .gb{opacity:.35}
.d-blue1 .c.done{background:#E6F0FA;border-color:#D3E3F4}.d-blue1 .c.done .no,.d-blue1 .c.done .nm{color:#7E9BB8}
.d-bgray .c.done{background:#E9EEF3;border-color:#DBE2EA}.d-bgray .c.done .no,.d-bgray .c.done .nm{color:#8193A6}

.d-tick .c.done::before{color:var(--navy)}.d-tickg .c.done::before{color:#A3A8AF}.d-tickb .c.done::before{color:#4A86C5}
.d-dot .c.done::before{content:'';position:absolute;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#1E9E5A}.d-dot .c.done .no{padding-left:9px}
.d-bar .c.done{box-shadow:inset 0 -5px 0 #1E9E5A}
.d-ring .c.done{box-shadow:inset 0 0 0 2.5px #1E9E5A}
.d-badge .c.done::before{content:'✓';position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#1E9E5A;color:#fff;font:900 10px/16px Inter,sans-serif;text-align:center}
.d-stamp .c.done::after{content:'완료';position:absolute;right:3px;bottom:3px;transform:rotate(-14deg);border:2px solid #1E9E5A;color:#1E9E5A;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font:900 9px 'Noto Sans KR',sans-serif;background:#ffffffd9}
