<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📋 정비보고서</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@600;700;800&display=swap">
<style>
/* VOICE: 현장 업무 도구 — 오더테이커 PC 에서 하루 종일 켜 두는 화면. 차분하고 빠르게
   IDEA: 엑셀 정비보고서의 층×호실 격자를 그대로, 대신 계산·색칠·안내는 앱이 함
   PICTURE: 첫 화면 = 417실 격자 자체 (위 요약 · 카드, 오른쪽 편집 칸)
   COLOUR/TYPE: 지금 쓰는 앱들과 같은 네이비 #10233F + 주황 강조, 엑셀 상태색(연두·주황·회색·하늘). Noto Sans KR + Inter 숫자
   LAYOUT: 위 띠(날짜·탭) / 요약·카드 / 격자 + 오른쪽 편집 칸. 760px 아래는 편집 칸이 아래로 */
:root{color-scheme:light;--bg:#F3F1EC;--paper:#fff;--ink:#14213A;--mute:#6B7280;--line:#DAD6CC;--navy:#10233F;--org:#E8730C;--orgL:#FFE3C7;
--s1:#B6EAB6;--s2:#FFB257;--s3:#C4C4C4;--s4:#A9CDEE;--ok:#1E9E5A;--bad:#C62828}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:Inter,'Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;padding:8px max(2vw,12px) 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:900;letter-spacing:-.3px}
.tag{font-size:12px;background:#ffffff1f;border-radius:6px;padding:2px 8px}
.days{display:flex;gap:4px;overflow-x:auto;padding:7px 0 8px;scrollbar-width:thin}
.days button{flex:1 0 auto;border:0;background:#ffffff14;color:#cfd8e6;border-radius:8px;padding:3px 6px;min-height:30px;min-width:34px}
.days button.on{background:#fff;color:var(--navy);font-weight:800}
.days button.today{box-shadow:inset 0 0 0 2px var(--org)}.days button.fut{opacity:.45}.mons{display:flex;gap:3px}.mons .mon{border:1px solid #ffffff40;background:transparent;color:#fff;font-weight:800;border-radius:8px;min-height:30px;padding:2px 10px}.mons .mon.on{background:#fff;color:var(--navy)}
.tabs{display:flex;gap:4px;margin-left:auto}
.fs{border:1px solid #ffffff40;background:transparent;color:#fff;border-radius:8px;padding:3px 10px;min-height:30px;font-weight:700}
.tabs button{border:0;background:#ffffff14;color:#cfd8e6;padding:6px 14px;border-radius:9px;font-weight:700;min-height:36px}
.tabs button.on{background:var(--org);color:#fff}
main{padding:10px max(2vw,12px) 40px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tile b{display:block;font:800 24px/1.1 Inter,sans-serif}
.tile small{color:var(--mute);font-size:12px}
.tile.ok b::after{content:' ✓';color:var(--ok);font-size:14px}
.check{font-size:12.5px;margin:-2px 0 10px;color:var(--mute)}
.check .good{color:var(--ok);font-weight:700}.check .warn{color:var(--org);font-weight:700}
.cards{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 9px;display:flex;gap:6px;align-items:center;font-size:13px;min-height:34px}
.card .u{font:700 13px Inter,sans-serif;color:var(--navy)}
.card.off{background:#7F8A96;color:#fff;border-color:#7F8A96}.card.off .u{color:#fff}
.card.quit{background:var(--bad);color:#fff;border-color:var(--bad)}
.card.in{background:#E3F6EA;border-color:#9ED4B4}
.card.focus{outline:3px solid var(--org)}
.card i{font-style:normal;font-size:11px;background:var(--ok);color:#fff;border-radius:5px;padding:0 4px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) clamp(330px,25vw,400px);gap:12px;align-items:start}
.left{min-width:0}
.gridbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px;overflow:hidden;user-select:none}
.g{display:grid;grid-template-columns:30px repeat(17,minmax(0,1fr));gap:2px}
.fl{font:800 13px Inter,sans-serif;color:var(--mute);display:flex;align-items:center;justify-content:center}
.c{position:relative;border:1px solid #E4E1D8;border-radius:7px;background:#fff;min-height:58px;padding:3px 4px 3px 6px;font-size:11.5px;line-height:1.25;cursor:cell;overflow:hidden}
.c.e{visibility:hidden}
.c .no{font:700 11px Inter,sans-serif;color:#5b6474}
.c .nm{font-weight:700;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .mm{display:flex;flex-wrap:wrap;gap:2px;margin-top:1px}
.c .mm span{font-size:10px;border-radius:4px;padding:0 3px;background:#eef0f3;color:#333;white-space:pre-line;word-break:break-all;line-height:1.25}   /* 11/26 말줄임 없이 줄바꿈 · 여러 줄 메모 */
.c.s1{background:var(--s1)}.c.s2{background:var(--s2)}.c.s3{background:var(--s3)}.c.s4{background:var(--s4)}
.c .gb{position:absolute;left:0;right:0;top:0;height:4px}
.c.yl{background:#FFF27A}
.c .dn{float:right;color:var(--ok);font-weight:900;margin-left:2px}
.c.done{opacity:.55}
.c .smp{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:800;color:#8a4b00}
.c.sel{outline:2.5px solid var(--navy);outline-offset:-1px;z-index:2}
.c.cur{outline:3px solid #2563EB;z-index:3}
.c.dim{opacity:.22}
.c.pr{box-shadow:0 0 0 2px var(--org),0 0 12px 2px #ff8a1f99;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--org),0 0 18px 6px #ff8a1fcc}}
@media (prefers-reduced-motion:reduce){.c.pr,.ph .pr{animation:none}}
.side{display:flex;flex-direction:column;gap:8px}
.stabs{display:flex;gap:4px}.stabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;min-height:38px;font-weight:700}
.stabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-height:760px){.side .box{padding:6px 9px}.side .btns button{min-height:30px;padding:2px 7px;font-size:13px}.side .inp,#cmd{min-height:34px}.side .box h3{font-size:13px;margin-bottom:4px}.stabs button{min-height:34px}.gf textarea{min-height:54px}}

.wrap.one{grid-template-columns:minmax(0,1fr)}
.ebar{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 6px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--line);margin-bottom:6px}
.eb1,.eb2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ebar .btns{gap:4px}.ebar .btns button{min-height:34px;padding:3px 9px}
.eb2 .btns button{min-height:30px;padding:2px 8px;font-size:13px}
.plate{display:flex;align-items:baseline;gap:7px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:9px;padding:5px 12px 5px 10px;min-width:150px;min-height:38px}
.plate b{font:800 20px/1 Inter,sans-serif;color:var(--navy);letter-spacing:.3px}
.plate small{font:700 11px Inter,sans-serif;color:var(--mute)}
.plate i{font-style:normal;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.plate i.none{color:var(--mute)}
.plate.s1{border-left-color:#7CCB7C}.plate.s2{border-left-color:#F29A2E}.plate.s3{border-left-color:#A6A6A6}.plate.s4{border-left-color:#7FB2E0}.plate.yl{border-left-color:#E8D44D}
.plate.empty{border-left-color:var(--line)}.plate.empty b{color:var(--mute)}
#fmemo{flex:1 1 220px;max-width:340px;min-height:32px;font-size:14px;resize:none;line-height:1.3;padding-top:6px;padding-bottom:6px;font-family:inherit}
.namebox{position:relative;flex:1 1 220px;max-width:320px}.namebox #cmd{width:100%;min-height:38px;font-size:16px}
.namebox .sug{position:absolute;left:0;top:calc(100% + 4px);z-index:8;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px #0002;min-width:100%;margin:0}
.namebox .sug:empty{display:none}
.drw{margin-left:auto}.qk{flex:0 1 360px;margin-left:auto}.qk #quick{min-height:32px;font-size:14px}.qk select{width:88px;flex:none;min-height:32px;font-size:13px}
/* 완료 표시 방식 (비교용) */
.dstyle{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--mute);margin:0 0 8px}.dstyle button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 9px;min-height:28px;font-size:12.5px}.dstyle button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.gridbox:not(.ds-check) .c .dn{display:none}
.gridbox:not(.ds-check) .c.done{opacity:1}
/* A 모서리 접기: 오른쪽 위가 초록으로 접힌 종이 */
.ds-corner .c.done::before{content:'';position:absolute;right:0;top:0;width:22px;height:22px;background:linear-gradient(225deg,#1E9E5A 50%,transparent 50%);border-top-right-radius:6px}
.ds-corner .c.done .nm,.ds-corner .c.done .no{color:#5f6b5f}
/* B 도장: 가운데 둥근 '완료' 도장 (레포트 앱 도장과 같은 느낌) */
.ds-stamp .c.done::after{content:'완료';position:absolute;right:3px;bottom:3px;transform:rotate(-14deg);border:2px solid #1E9E5A;color:#1E9E5A;border-radius:50%;width:clamp(24px,36cqw,32px);height:clamp(24px,36cqw,32px);display:flex;align-items:center;justify-content:center;font:900 clamp(8px,11cqw,10px) 'Noto Sans KR',sans-serif;background:#ffffffd9;pointer-events:none}
/* C 아래 띠: 칸 아래 굵은 초록 띠 + 글자 차분하게 */
.ds-bar .c.done{box-shadow:inset 0 -5px 0 #1E9E5A}.ds-bar .c.done .nm{color:#4b5563}
/* D 진한 채움: 끝난 방은 진한 초록 + 흰 글자 → 층별 진행이 한눈에 */
.ds-fill .c.done{background:#1E7F4D!important;border-color:#1E7F4D}.ds-fill .c.done .no,.ds-fill .c.done .nm{color:#fff}.ds-fill .c.done .mm span{background:#ffffff33!important;color:#fff}.ds-fill .c.done .smp{color:#d8ffe9}
/* E 흑백 + 배지: 끝난 방은 색이 빠지고(남은 방만 컬러) 오른쪽 위 초록 원 ✓ */
.ds-gray .c.done{background:#EDEDEA!important;border-color:#e2e2de}.ds-gray .c.done .no,.ds-gray .c.done .nm,.ds-gray .c.done .smp{color:#9a9fa6}.ds-gray .c.done .mm,.ds-gray .c.done .gb{filter:grayscale(1);opacity:.6}
.ds-gray .c.done::before,.ds-badge .c.done::before{content:'✓';position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#1E9E5A;color:#fff;font:900 10px/16px Inter,sans-serif;text-align:center;box-shadow:0 1px 3px #0003}
/* F 원형 배지만: 색은 그대로, 오른쪽 위 초록 원 ✓ */
.ds-badge .c.done .no{color:#5b6474}
/* G 사선 무늬: 상태색 위에 옅은 사선 → 종이에 줄 그은 느낌 */
.ds-hatch .c.done{background-image:repeating-linear-gradient(135deg,#ffffff00 0 6px,#1E9E5A22 6px 8px)!important}.ds-hatch .c.done .nm{color:#2f6b47}
/* H 초록 테두리: 방 둘레가 초록 링 */
.ds-ring .c.done{box-shadow:inset 0 0 0 2.5px #1E9E5A}.ds-ring .c.done .nm{color:#1E7F4D}
/* 조용한 완료 (11/26 확정안): 끝난 방은 색을 빼고 물러나게, 작은 회색 ✓ · 방금 끝난 방만 잠깐 초록 → 서서히 회색 */
.ds-quiet .c.done{background:#F2F1EE;border-color:#E7E5E0}
.ds-quiet .c.done .no,.ds-quiet .c.done .nm,.ds-quiet .c.done .smp{color:#A3A8AF}
.ds-quiet .c.done .mm,.ds-quiet .c.done .gb{filter:grayscale(1);opacity:.5}
.ds-quiet .c.done::before{content:'✓';position:absolute;right:4px;top:2px;font:800 11px Inter,sans-serif;color:#A3A8AF}
.ds-quiet .c.done.jd{animation:jd 90s linear forwards}
.gridbox:not(.ds-quiet) .c.done.jd{animation:jd2 6s ease-out forwards}
@keyframes jd2{0%{box-shadow:0 0 0 3px #3DAA6B88}100%{box-shadow:0 0 0 0 #3DAA6B00}}
.ds-quiet .c.done.jd::before{color:#1E9E5A}
@keyframes jd{0%{background:#C9F0D6;border-color:#7CCB98;box-shadow:0 0 0 2px #7CCB9866}8%{background:#D9F4E2;border-color:#9AD8AF;box-shadow:none}100%{background:#F2F1EE;border-color:#E7E5E0}}
@media (prefers-reduced-motion:reduce){.ds-quiet .c.done.jd{animation:none}}
/* 완료 = 연한 푸른색 시안 (조용한 완료 위에 색만 바꿈) */
.ds-b1 .c.done{background:#E6F0FA;border-color:#D3E3F4}.ds-b1 .c.done .no,.ds-b1 .c.done .nm,.ds-b1 .c.done .smp{color:#7E9BB8}.ds-b1 .c.done::before{color:#4A86C5}
.ds-b2 .c.done{background:#DCEBFF;border-color:#C2DAFA}.ds-b2 .c.done .no,.ds-b2 .c.done .nm,.ds-b2 .c.done .smp{color:#5D84B5}.ds-b2 .c.done::before{content:'✓';color:#fff;background:#4A86C5;border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center;font-size:9px;top:3px;right:3px}
.ds-b3 .c.done{background:#E9EEF3;border-color:#DBE2EA}.ds-b3 .c.done .no,.ds-b3 .c.done .nm,.ds-b3 .c.done .smp{color:#8193A6}.ds-b3 .c.done::before{color:#5B7896}
#ask{position:fixed;inset:0;background:#0f172a55;display:none;align-items:center;justify-content:center;z-index:60}#ask.on{display:flex}
.askbox{background:#fff;border-radius:14px;padding:18px 20px;max-width:420px;width:90vw;box-shadow:0 20px 50px #0004;border-top:4px solid #A6A6A6}
.askbox b{font-size:17px}.askbox p{margin:6px 0 14px;color:var(--mute)}.askbox .btns{justify-content:flex-end}.askbox .btns button{min-height:40px;padding:0 14px}
/* ④ 취소선: 할 일 목록에서 지운 것처럼 — 이름에 가는 줄, 바탕 연한 회색 */
.ds-s4 .c.done{background:#F6F5F2;border-color:#ECEAE5}.ds-s4 .c.done .nm{color:#9CA3AF;text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#6B7280}.ds-s4 .c.done .no{color:#A3A8AF}.ds-s4 .c.done::before{display:none}
/* ⑤ 빛바램: 원래 상태색은 남기되 옅게, 오른쪽 위 네이비 ✓ (앱 색과 같은 톤) */
.ds-s5 .c.done{background:transparent;border-color:#E3E0D9}.ds-s5 .c.done.s1{background:#EEF8EE}.ds-s5 .c.done.s2{background:#FDF0E1}.ds-s5 .c.done.s3{background:#F1F1F1}.ds-s5 .c.done.s4{background:#EEF4FA}
.ds-s5 .c.done .no,.ds-s5 .c.done .nm{color:#8A93A0}.ds-s5 .c.done::before{color:var(--navy);font-size:12px;right:4px;top:2px}.ds-s5 .c.done .mm,.ds-s5 .c.done .gb{filter:none;opacity:.55}
/* ⑥ 흰 바탕: 끝난 방은 하얗게 비우고 가는 테두리만 — 색은 할 일에만 */
.ds-s6 .c.done{background:#fff;border-color:#E5E7EB}.ds-s6 .c.done .no,.ds-s6 .c.done .nm,.ds-s6 .c.done .smp{color:#B0B5BC}.ds-s6 .c.done::before{color:#B0B5BC}.ds-s6 .c.done .mm,.ds-s6 .c.done .gb{opacity:.35}
/* ⑦ 작은 점: 바탕은 옅게, 호실 번호 앞 초록 점 하나 */
.ds-s7 .c.done{background:#F7F6F3;border-color:#ECEAE5}.ds-s7 .c.done .no,.ds-s7 .c.done .nm{color:#9CA3AF}.ds-s7 .c.done::before{content:'';right:auto;left:5px;top:6px;width:6px;height:6px;border-radius:50%;background:#1E9E5A}.ds-s7 .c.done .no{padding-left:9px}
/* 모서리 접힘 시안: 오른쪽 위가 종이처럼 접힘 (잘린 자리 = 화면 바탕색, 접힌 면 = 뒷면 색 + 그림자) */
.ds-f1 .c.done::before,.ds-f2 .c.done::before,.ds-f3 .c.done::before,.ds-f4 .c.done::before,.ds-f5 .c.done::before{content:'';position:absolute;top:-1px;right:-1px;width:18px;height:18px;border-bottom-left-radius:4px;box-shadow:-2px 2px 3px #0000002a;background:linear-gradient(225deg,#fff 0 50%,var(--fold) 50%);z-index:1}
.ds-f1 .c.done,.ds-f2 .c.done,.ds-f3 .c.done,.ds-f4 .c.done,.ds-f5 .c.done{border-top-right-radius:0}
/* A 종이 접힘: 색은 그대로, 접힌 면은 종이 뒷면(연회색) */
.ds-f1 .c.done{--fold:#DAD7D0}.ds-f1 .c.done .nm{color:#5b6474}
/* B 초록 접힘: 접힌 면이 초록 */
.ds-f2 .c.done{--fold:#3DAA6B}
/* C 네이비 접힘: 접힌 면이 앱 네이비, 글자 조금 흐리게 */
.ds-f3 .c.done{--fold:#1F3A60}.ds-f3 .c.done .nm,.ds-f3 .c.done .no{color:#6b7584}
/* D 큰 접힘 + ✓: 접힌 면 안에 작은 ✓ */
.ds-f4 .c.done{--fold:#2E8B57}.ds-f4 .c.done::before{width:24px;height:24px}
.ds-f4 .c.done::after{content:'✓';position:absolute;top:11px;right:3px;font:900 9px/1 Inter,sans-serif;color:#fff;z-index:2}
/* E 접힘 + 빛바램: 바탕 옅게 + 연회색 접힘 */
.ds-f5 .c.done{--fold:#C9CDD3;background:#F5F4F1}.ds-f5 .c.done.s1{background:#EEF8EE}.ds-f5 .c.done.s2{background:#FDF0E1}.ds-f5 .c.done.s4{background:#EEF4FA}.ds-f5 .c.done .nm,.ds-f5 .c.done .no{color:#8A93A0}.ds-f5 .c.done .mm{opacity:.55}
/* 접힘 시안에서는 '방금 끝남' 초록 빛은 유지하되 ✓ 글자는 숨김 */
.ds-f1 .c.done.jd::before,.ds-f2 .c.done.jd::before,.ds-f3 .c.done.jd::before,.ds-f4 .c.done.jd::before,.ds-f5 .c.done.jd::before{color:transparent}
/* ===== 완료 표시 조합 (d-*) ===== */
.d-fade .c.done{background:#F5F4F1;border-color:#E6E3DD}.d-fade .c.done.s1{background:#EEF8EE}.d-fade .c.done.s2{background:#FDF0E1}.d-fade .c.done.s4{background:#EEF4FA}
.d-fade .c.done .no,.d-fade .c.done .nm,.d-fade .c.done .smp{color:#8A93A0}.d-fade .c.done .mm,.d-fade .c.done .gb{opacity:.5}
